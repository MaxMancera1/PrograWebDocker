<form enctype="multipart/form-data" action="marca.php?accion=<?php echo $accion; isset($datos['id']) ? print '&id='.$datos['id'] : print '';?>" method="post">

        <?php if (!empty($datos['error'])): ?>
        <p class="text-danger"><?php echo $datos['error']; ?></p>

            <label for="logo" class="logo-preview">

            </label>
            <input type="file" name="logo" class="d-none" id="logo" accept="image/*" <?php echo $accion === 'create' ? 'required' : ''; ?>>

        <div class="mb-3">
          <label class="form-label">Marca</label>

            <option value="<?php echo $proveedor['id']; ?>" <?php echo (string) $proveedor['id'] === (string) ($datos['id_proveedor'] ?? '') ? 'selected' : ''; ?>><?php echo htmlspecialchars($proveedor['razon_social']); ?></option>

</form>
<style>
.logo-preview {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  overflow: hidden;
  display: inline-block;
  border: 2px dashed #adb5bd;
  cursor: pointer;
  background: #f8f9fa;
}
.logo-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
</style>
<script>
document.getElementById('logo').addEventListener('change', function () {
  var file = this.files && this.files[0];
  if (!file) return;
  document.getElementById('logoPreview').src = URL.createObjectURL(file);
  var nombre = document.getElementById('nombreImagen');
  if (nombre) nombre.value = file.name;
});
</script>
