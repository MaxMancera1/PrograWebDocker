<form enctype="multipart/form-data" action="producto.php?accion=<?php echo $accion; isset($datos['id']) ? print '&id='.$datos['id'] : print '';?>" method="post">

        <?php if (!empty($datos['error'])): ?>
        <p class="text-danger"><?php echo $datos['error']; ?></p>
        <?php endif; ?>

        <div class="mb-3">
            <label class="form-label d-block">Foto</label>
            <label for="foto" class="foto-preview">
              <img id="fotoPreview" alt="" <?php if (!empty($datos['foto'])): ?>src="../img/uploads/<?php echo htmlspecialchars($datos['foto']); ?>?v=<?php echo @filemtime(__DIR__ . '/../../../img/uploads/' . $datos['foto']); ?>"<?php endif; ?>>
            </label>
            <input type="file" name="foto" class="d-none" id="foto" accept="image/*" <?php echo $accion === 'create' ? 'required' : ''; ?>>
        </div>

        <div class="mb-3">
          <label class="form-label">Producto</label>
          <input type="text" name="data[producto]" value="<?php isset($datos['producto']) ? print $datos['producto'] : print '';?>"  class="form-control" id="producto" aria-describedby="productoHelp" >
        </div>

        <div class="mb-3">
            <label class="form-label">Precio</label>
            <input type="text" name="data[precio]" value="<?php isset($datos['precio']) ? print $datos['precio'] : print '';?>"  class="form-control" id="precio" aria-describedby="precioHelp">

        <div class="mb-3">

          <select name="data[id_marca]" class="form-control" id="id_marca">

            <?php foreach ($marcas as $marca): ?>
            <option value="<?php echo $marca['id']; ?>" <?php echo (string) $marca['id'] === (string) ($datos['id_marca'] ?? '') ? 'selected' : ''; ?>><?php echo htmlspecialchars($marca['marca']); ?></option>

        <div class="mb-3 d-flex align-items-center gap-3">
          <input type="text" class="form-control" id="nombreImagen" value="Seleccionar imagen" readonly style="max-width:280px">
          <label for="foto" class="btn btn-primary mb-0">Seleccionar</label>
        </div>
        <?php endif; ?>

        <input type="submit" class="btn btn-success" name="enviar" value="Guardar">

</form>
<style>
.foto-preview {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  overflow: hidden;
  display: inline-block;
  border: 2px dashed #adb5bd;
  cursor: pointer;
  background: #f8f9fa;
}
.foto-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
</style>
<script>
document.getElementById('foto').addEventListener('change', function () {
  var file = this.files && this.files[0];
  if (!file) return;
  document.getElementById('fotoPreview').src = URL.createObjectURL(file);
  var nombre = document.getElementById('nombreImagen');
  if (nombre) nombre.value = file.name;
});
</script>
